name: Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install interface dependencies
        working-directory: web
        run: npm ci

      - name: Build interface
        working-directory: web
        run: npm run build

      - name: Test
        run: go test -tags ui ./...

      - name: Build Windows app
        if: runner.os == 'Windows'
        run: go build -tags ui -ldflags "-H windowsgui" -o place-space.exe ./cmd/placespace

      - name: Build Mac app
        if: runner.os == 'macOS'
        run: |
          go build -tags ui -o place-space ./cmd/placespace
          app="Place Space.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS"
          cp place-space "$app/Contents/MacOS/place-space"
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          chmod +x "$app/Contents/MacOS/place-space"
          ditto -c -k --keepParent "$app" place-space-macos.zip

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: place-space-windows
          path: place-space.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: place-space-macos
          path: place-space-macos.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/place-space.exe
            dist/place-space-macos.zip
          body: |
            Windows: запустіть place-space.exe. Mac: розпакуйте Place Space.app.
            Відкриється власне вікно, база з’явиться поруч у папці data.
            Закриття вікна зупиняє перевірки. Журнал — data/place-space.log.
